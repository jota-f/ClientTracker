{% extends "base.html" %}

{% block title %}Diagnóstico de Autenticação - ClientTracker{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white shadow sm:rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900">
                    Diagnóstico de Autenticação
                </h3>
                
                <div class="mt-5">
                    <div id="auth-status" class="space-y-4">
                        <!-- Status será preenchido via JavaScript -->
                    </div>
                    
                    <div class="mt-8">
                        <button id="check-auth" type="button" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Verificar Autenticação
                        </button>
                        
                        <button id="clear-auth" type="button" class="ml-3 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Limpar Dados de Autenticação
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const authStatus = document.getElementById('auth-status');
        const checkAuthButton = document.getElementById('check-auth');
        const clearAuthButton = document.getElementById('clear-auth');
        
        function addStatusItem(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `p-4 rounded-md ${type === 'error' ? 'bg-red-50 text-red-700' : type === 'success' ? 'bg-green-50 text-green-700' : 'bg-blue-50 text-blue-700'}`;
            div.textContent = message;
            authStatus.appendChild(div);
        }
        
        function clearStatus() {
            authStatus.innerHTML = '';
        }
        
        async function checkAuth() {
            clearStatus();
            
            // Verifica se há token no localStorage
            const token = localStorage.getItem('access_token');
            if (!token) {
                addStatusItem('Nenhum token de acesso encontrado no localStorage', 'error');
                return;
            }
            
            addStatusItem(`Token encontrado no localStorage: ${token.substring(0, 20)}...`);
            
            // Verifica se há dados do usuário
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                addStatusItem('Nenhum dado de usuário encontrado no localStorage', 'error');
            } else {
                try {
                    const user = JSON.parse(userStr);
                    addStatusItem(`Dados do usuário encontrados: ${user.email}`, 'success');
                } catch (e) {
                    addStatusItem('Erro ao parsear dados do usuário', 'error');
                }
            }
            
            // Tenta fazer uma requisição autenticada
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addStatusItem('Token válido! Usuário autenticado com sucesso.', 'success');
                    addStatusItem(`Usuário: ${data.email}`, 'success');
                } else {
                    const error = await response.text();
                    addStatusItem(`Token inválido ou expirado: ${error}`, 'error');
                }
            } catch (error) {
                addStatusItem(`Erro ao verificar token: ${error.message}`, 'error');
            }
        }
        
        function clearAuth() {
            clearStatus();
            
            // Remove dados de autenticação
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            
            addStatusItem('Dados de autenticação removidos com sucesso', 'success');
            
            // Verifica se foram realmente removidos
            const token = localStorage.getItem('access_token');
            const user = localStorage.getItem('user');
            
            if (!token && !user) {
                addStatusItem('Verificação: dados removidos corretamente', 'success');
            } else {
                addStatusItem('Erro: alguns dados ainda persistem no localStorage', 'error');
            }
        }
        
        // Adiciona listeners aos botões
        checkAuthButton.addEventListener('click', checkAuth);
        clearAuthButton.addEventListener('click', clearAuth);
        
        // Executa verificação inicial
        checkAuth();
    });
</script>
{% endblock %}
