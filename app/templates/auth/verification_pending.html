{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Verificação de Email Pendente</h1>
            <p class="text-gray-600 mt-2">
                Para sua segurança, precisamos verificar seu endereço de email.
            </p>
        </div>

        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-yellow-700">
                        Enviamos um email de verificação para seu endereço de email.
                        Por favor, verifique sua caixa de entrada e spam.
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button 
                onclick="resendVerificationEmail(this)"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition-colors"
                id="resendButton">
                Reenviar Email de Verificação
            </button>
        </div>
    </div>
</div>

<script>
async function resendVerificationEmail(button) {
    button.disabled = true;
    button.textContent = 'Enviando...';

    try {
        // Tenta obter o email temporário
        const email = localStorage.getItem('temp_email');
        if (!email) {
            alert('Erro: Email não encontrado. Por favor, tente fazer login novamente.');
            window.location.href = '/login';
            return;
        }

        console.log('Enviando requisição para reenviar email para:', email);

        const response = await fetch('/api/auth/resend-verification', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email })
        });

        console.log('Status da resposta:', response.status);
        const data = await response.json();
        console.log('Dados da resposta:', data);

        if (response.ok) {
            alert('Email de verificação reenviado com sucesso! Por favor, verifique sua caixa de entrada e spam.');
        } else {
            alert(data.detail || 'Erro ao reenviar email');
            if (response.status === 404) {
                window.location.href = '/login';
            }
        }
    } catch (error) {
        console.error('Erro ao reenviar email:', error);
        alert('Erro ao reenviar email: ' + error.message);
    } finally {
        button.disabled = false;
        button.textContent = 'Reenviar Email de Verificação';
    }
}

// Verifica se tem email salvo ao carregar a página
document.addEventListener('DOMContentLoaded', function() {
    const email = localStorage.getItem('temp_email');
    if (!email) {
        window.location.href = '/login';
    }
});
</script>
{% endblock %}
