{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Email Verificado com Sucesso!</h1>
            <p class="text-gray-600 mt-2">
                Seu email foi verificado com sucesso. Agora você pode acessar todos os recursos do sistema.
            </p>
        </div>

        <div class="bg-green-50 border-l-4 border-green-400 p-4 mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-green-700">
                        Sua conta está ativa e você já pode aproveitar todas as funcionalidades.
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a 
                href="/login"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition-colors inline-block">
                Fazer Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
