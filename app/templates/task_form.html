{% extends "base.html" %}

{% block title %}
{% if task %}Editar Tarefa{% else %}Nova Tarefa{% endif %} | ClientTracker
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h2 class="h4 mb-0">
                        {% if task %}
                        Editar Tarefa
                        {% else %}
                        Nova Tarefa
                        {% endif %}
                    </h2>
                </div>
                <div class="card-body">
                    <form id="taskForm" action="{% if task %}/api/v1/tasks/{{ task.id }}{% else %}/api/v1/tasks{% endif %}" method="POST">
                        <div class="row mb-3">
                            <div class="col-12">
                                <label for="title" class="form-label">Título *</label>
                                <input type="text" class="form-control" id="title" name="title" value="{% if task %}{{ task.title }}{% endif %}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-12">
                                <label for="description" class="form-label">Descrição</label>
                                <textarea class="form-control" id="description" name="description" rows="3">{% if task %}{{ task.description }}{% endif %}</textarea>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="priority" class="form-label">Prioridade (Matriz Eisenhower) *</label>
                                <select class="form-select" id="priority" name="priority" required>
                                    <option value="" disabled {% if not task %}selected{% endif %}>Selecione uma prioridade</option>
                                    <option value="URGENT_IMPORTANT" {% if task and task.priority == "URGENT_IMPORTANT" %}selected{% endif %}>
                                        Q1: Urgente e Importante
                                    </option>
                                    <option value="NOT_URGENT_IMPORTANT" {% if task and task.priority == "NOT_URGENT_IMPORTANT" %}selected{% endif %}>
                                        Q2: Não Urgente e Importante
                                    </option>
                                    <option value="URGENT_NOT_IMPORTANT" {% if task and task.priority == "URGENT_NOT_IMPORTANT" %}selected{% endif %}>
                                        Q3: Urgente e Não Importante
                                    </option>
                                    <option value="NOT_URGENT_NOT_IMPORTANT" {% if task and task.priority == "NOT_URGENT_NOT_IMPORTANT" %}selected{% endif %}>
                                        Q4: Não Urgente e Não Importante
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="status" class="form-label">Status *</label>
                                <select class="form-select" id="status" name="status" required>
                                    <option value="TODO" {% if not task or task.status == "TODO" %}selected{% endif %}>A Fazer</option>
                                    <option value="IN_PROGRESS" {% if task and task.status == "IN_PROGRESS" %}selected{% endif %}>Em Progresso</option>
                                    <option value="DONE" {% if task and task.status == "DONE" %}selected{% endif %}>Concluída</option>
                                    <option value="ARCHIVED" {% if task and task.status == "ARCHIVED" %}selected{% endif %}>Arquivada</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="due_date" class="form-label">Data de Vencimento</label>
                                <input type="date" class="form-control" id="due_date" name="due_date" 
                                       value="{% if task and task.due_date %}{{ task.due_date.strftime('%Y-%m-%d') }}{% endif %}">
                            </div>
                            <div class="col-md-6">
                                <label for="client_id" class="form-label">Cliente Associado</label>
                                <select class="form-select" id="client_id" name="client_id">
                                    <option value="">Nenhum cliente</option>
                                    {% for client in clients %}
                                    <option value="{{ client.id }}" 
                                            {% if task and task.client_id == client.id|string %}selected{% endif %}>
                                        {{ client.name }} ({{ client.company }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="assignee" class="form-label">Responsável</label>
                                <input type="text" class="form-control" id="assignee" name="assignee" 
                                       value="{% if task %}{{ task.assignee }}{% endif %}">
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12 d-flex justify-content-between">
                                <a href="/tasks" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    {% if task %}Atualizar Tarefa{% else %}Criar Tarefa{% endif %}
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const taskForm = document.getElementById('taskForm');
        const submitBtn = document.getElementById('submitBtn');
        
        taskForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processando...';
            
            // Preparar os dados do formulário
            const formData = new FormData(taskForm);
            const taskData = {};
            
            for (const [key, value] of formData.entries()) {
                // Ignorar campos vazios opcionais
                if (value === '' && key !== 'client_id' && key !== 'assignee' && key !== 'description' && key !== 'due_date') {
                    continue;
                }
                
                taskData[key] = value;
            }
            
            // Método HTTP (POST para criar, PUT para atualizar)
            const method = {% if task %}'PUT'{% else %}'POST'{% endif %};
            
            try {
                const response = await fetch(taskForm.action, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(taskData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    window.location.href = '/tasks';
                } else {
                    const errorData = await response.json();
                    alert(`Erro: ${errorData.detail || 'Ocorreu um erro ao processar o pedido.'}`);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = {% if task %}'Atualizar Tarefa'{% else %}'Criar Tarefa'{% endif %};
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Ocorreu um erro ao processar o pedido.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = {% if task %}'Atualizar Tarefa'{% else %}'Criar Tarefa'{% endif %};
            }
        });
    });
</script>
{% endblock %}
