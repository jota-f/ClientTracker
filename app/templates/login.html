{% extends "base.html" %}

{% block title %}Login - ClientTracker{% endblock %}

{% block content %}
<div class="flex flex-col justify-center min-h-[calc(100vh-4rem)] py-12 sm:px-6 lg:px-8 bg-gray-50">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Login
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Ou
            <a href="/register" class="font-medium text-indigo-600 hover:text-indigo-500">
                crie uma nova conta
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <div id="error-message" class="mb-4 p-4 rounded-md bg-red-50 text-red-700 hidden">
                <!-- Mensagem de erro será exibida aqui via JavaScript -->
            </div>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Email
                    </label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Senha
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Lembrar de mim
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="/forgot-password" class="font-medium text-indigo-600 hover:text-indigo-500">
                            Esqueceu sua senha?
                        </a>
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        
        // Função para mostrar mensagem de erro
        function showError(message, isSuccess = false) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            
            if (isSuccess) {
                errorMessage.classList.remove('bg-red-50', 'text-red-700');
                errorMessage.classList.add('bg-green-50', 'text-green-700');
            } else {
                errorMessage.classList.remove('bg-green-50', 'text-green-700');
                errorMessage.classList.add('bg-red-50', 'text-red-700');
            }
        }
        
        // Função para verificar se o token foi salvo corretamente
        function verifyToken(token) {
			console.error('entrou na funcao');
			return new Promise((resolve, reject) => {
				// Primeiro, tenta salvar o token
				localStorage.setItem('access_token', token);
				
				// Verifica se foi salvo corretamente
				const savedToken = localStorage.getItem('access_token');
				if (!savedToken) {
					reject(new Error('Falha ao salvar o token no localStorage'));
					return;
				}
				
				if (savedToken !== token) {
					reject(new Error('Token salvo não corresponde ao token original'));
					return;
				}
				
				// Verifica se o token é válido fazendo uma requisição
				fetch('/api/auth/me', {
					headers: {
						'Authorization': `Bearer ${token}`
					}
				})
				.then(response => {
					if (!response.ok) {
						// Se o token for inválido (401), limpa o localStorage
						if (response.status === 401) {
							localStorage.removeItem('access_token');
							localStorage.removeItem('user');
						}
						console.error('Erro ao verificar token:', response.status, response.statusText);
						throw new Error('Token inválido ou expirado');
					}
					return response.json();
				})
				.then(() => resolve(true))
				.catch(error => {
					// Remove o token do localStorage se a verificação falhar
					localStorage.removeItem('access_token');
					localStorage.removeItem('user');
					reject(error);
				});
			});
		}

		// Função para verificar autenticação
		function isAuthenticated() {
			const token = localStorage.getItem('access_token');
			if (!token) return false;

			// Verifica se o token é válido
			fetch('/api/auth/me', {
				headers: {
					'Authorization': `Bearer ${token}`
				}
			})
			.then(response => {
				if (!response.ok) {
					// Se o token for inválido, limpa o localStorage e redireciona para login
					localStorage.removeItem('access_token');
					localStorage.removeItem('user');
					window.location.href = '/login';
					return false;
				}
				return true;
			})
			.catch(() => {
				localStorage.removeItem('access_token');
				localStorage.removeItem('user');
				window.location.href = '/login';
				return false;
			});

			return true;
		}


        
        // Limpa tokens inválidos
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid_token') {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            showError('Sua sessão expirou. Por favor, faça login novamente.');
        }
        
        // Se veio da página de registro
        if (urlParams.get('registered') === 'true') {
            showError('Registro concluído com sucesso! Faça login para continuar.', true);
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                showError('Autenticando...', true);
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': email,
                        'password': password
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Erro ao fazer login');
                }
                
                if (!data.access_token) {
                    throw new Error('Token não recebido do servidor');
                }
                
                // Limpa qualquer token anterior
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                
                // Salva o token SEM o prefixo Bearer
                localStorage.setItem('access_token', data.access_token);
                
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                }
                
                showError('Login bem-sucedido! Redirecionando...', true);
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Redireciona para a página inicial ou para a página originalmente requisitada
                const redirectPath = sessionStorage.getItem('redirect_after_login') || '/';
                sessionStorage.removeItem('redirect_after_login');
                window.location.href = redirectPath;
                
            } catch (error) {
                console.error('Erro no login:', error);
                showError(error.message);
                
                const debugLink = document.createElement('div');
                debugLink.innerHTML = '<a href="/auth-debug" class="block mt-2 text-blue-600 hover:underline">Diagnosticar problemas de autenticação</a>';
                errorMessage.appendChild(debugLink);
            }
        });
    });
</script>
{% endblock %}
