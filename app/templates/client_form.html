{% extends "base.html" %}

{% block title %}{{ 'Novo' if not client else 'Editar' }} Cliente - ClientTracker{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-3xl font-bold mb-6">{{ 'Novo' if not client else 'Editar' }} Cliente</h1>

        <form id="clientForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" name="name" value="{{ client.name if client else '' }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Empresa</label>
                    <input type="text" name="company" value="{{ client.company if client else '' }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" name="email" value="{{ client.email if client else '' }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefone</label>
                    <input type="tel" name="phone" value="{{ client.phone if client else '' }}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <select name="status" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        {% for status in ['LEAD', 'OPPORTUNITY', 'CUSTOMER', 'ACTIVE', 'INACTIVE'] %}
                        <option value="{{ status }}" {{ 'selected' if client and client.status == status else '' }}>
                            {{ status }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Potencial de Venda (1-5)</label>
                    <input type="number" name="sales_potential" min="1" max="5" 
                        value="{{ client.sales_potential if client else '3' }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Próximo Follow-up</label>
                    <input type="date" name="next_followup" 
                        value="{{ client.next_followup.strftime('%Y-%m-%d') if client else '' }}" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
            </div>

            <div class="flex justify-end space-x-4 mt-6">
                <a href="/clients"
                    class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Cancelar
                </a>
                <button type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('clientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    // Formatação correta das datas com timezone UTC
    const nextFollowupDate = new Date(formData.get('next_followup'));
    const lastContactDate = new Date();
    
    // Função para garantir formato ISO8601 com timezone Z (UTC)
    const formatDateUTC = (date) => {
        try {
            // Garante que a data tenha timezone UTC
            return new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString();
        } catch (error) {
            console.error('Erro ao formatar data:', error);
            return new Date().toISOString(); // Fallback para data atual
        }
    };
    
    // Obter o ID do cliente atual (se existir)
    const clientId = '{{ client.id if client else "" }}';
    
    let data = {};
    
    if (clientId) {
        // Se estiver editando, obtenha os dados existentes primeiro
        try {
            const response = await fetch(`/api/v1/clients/${clientId}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                }
            });
            
            if (!response.ok) {
                throw new Error('Erro ao obter dados do cliente');
            }
            
            // Dados existentes que serão modificados
            data = await response.json();
            
            // Atualizar campos do formulário
            data.name = formData.get('name');
            data.company = formData.get('company');
            data.email = formData.get('email');
            data.phone = formData.get('phone');
            data.status = formData.get('status');
            data.sales_potential = parseInt(formData.get('sales_potential'));
            data.next_followup = formatDateUTC(nextFollowupDate);
            
            // Manter o last_contact existente se estiver editando
            // Apenas atualize se estiver fazendo uma interação
            if (!data.last_contact) {
                data.last_contact = formatDateUTC(lastContactDate);
            }
            
        } catch (error) {
            console.error('Erro ao obter cliente existente:', error);
            alert('Erro ao obter dados do cliente. Tente novamente.');
            return;
        }
    } else {
        // Se estiver criando um novo cliente
        data = {
            name: formData.get('name'),
            company: formData.get('company'),
            email: formData.get('email'),
            phone: formData.get('phone'),
            status: formData.get('status'),
            sales_potential: parseInt(formData.get('sales_potential')),
            next_followup: formatDateUTC(nextFollowupDate),
            last_contact: formatDateUTC(lastContactDate),
            interaction_history: [],
            pending_tasks: []
        };
    }

    console.log("Dados enviados para o servidor:", data);

    const method = clientId ? 'PUT' : 'POST';
    const url = `/api/v1/clients${clientId ? '/' + clientId : ''}`;

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
            },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            const errorData = await response.json();
            console.error('Erro detalhado:', errorData);
            throw new Error(errorData.detail || 'Erro ao salvar cliente');
        }

        const result = await response.json();
        console.log("Cliente salvo com sucesso:", result);
        window.location.href = '/clients';
    } catch (error) {
        console.error('Error:', error);
        alert(error.message || 'Erro ao salvar cliente. Verifique se todos os campos foram preenchidos corretamente.');
    }
});
</script>
{% endblock %}
