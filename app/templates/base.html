<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClientTracker{% endblock %}</title>
    <script>
        // Função para obter o token atual
        function getCurrentToken() {
            return localStorage.getItem('access_token');
        }

        // Função para adicionar o token aos headers
        function addTokenToHeaders() {
            const token = getCurrentToken();
            if (token) {
                // Cria um elemento meta para o token
                let tokenMeta = document.querySelector('meta[name="x-auth-token"]');
                if (!tokenMeta) {
                    tokenMeta = document.createElement('meta');
                    tokenMeta.name = 'x-auth-token';
                    document.head.appendChild(tokenMeta);
                }
                tokenMeta.content = token;
                
                // Adiciona o token como cookie
                document.cookie = `Authorization=Bearer ${token}; path=/; SameSite=Strict`;
                
                console.log('Token adicionado à meta tag e cookie para navegação');
                return true;
            }
            return false;
        }
        
        // Adiciona o token aos headers inicialmente
        addTokenToHeaders();
        
        // Hack para adicionar token em navegações HTML
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function() {
            this.addEventListener('readystatechange', function() {
                if (this.readyState === 1) { // OPENED
                    const token = getCurrentToken();
                    if (token) {
                        this.setRequestHeader('Authorization', `Bearer ${token}`);
                        console.log('Token adicionado a XMLHttpRequest');
                    }
                }
            });
            originalOpen.apply(this, arguments);
        };

        // Observa mudanças no localStorage para o token
        window.addEventListener('storage', function(e) {
            if (e.key === 'access_token') {
                addTokenToHeaders();
            }
        });
    </script>
    <script src="/static/js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hidden {
            display: none;
        }
        /* Custom styles here */
        .btn-primary {
            @apply bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors;
        }
        .card {
            @apply bg-white rounded-lg shadow-md p-6;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-indigo-600">ClientTracker</a>
                    </div>
                    <div class="sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/" class="border-transparent text-gray-500 hover:border-indigo-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/clients" class="border-transparent text-gray-500 hover:border-indigo-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Clientes
                        </a>
                        <a href="/tasks" class="border-transparent text-gray-500 hover:border-indigo-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Tarefas
                        </a>
                        <a href="/calendar" class="border-transparent text-gray-500 hover:border-indigo-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                            </svg>
                            Calendário
                        </a>
                        <div class="relative inline-flex items-center">
                            <button type="button" class="border-transparent text-gray-500 hover:border-indigo-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium group" id="task-views-menu" aria-expanded="false" aria-haspopup="true">
                                <span>Visualizações</span>
                                <svg class="ml-2 h-5 w-5 text-gray-400 group-hover:text-gray-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 011.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <div class="hidden origin-top-right absolute right-0 top-full mt-1 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-50" role="menu" aria-orientation="vertical" aria-labelledby="task-views-menu">
                                <div class="py-1" role="none">
                                    <a href="/tasks/kanban" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">Kanban</a>
                                    
                                    <a href="/tasks/priority-matrix" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">PriorityMatrix™</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="sm:ml-6 sm:flex sm:items-center">
                    <div class="ml-3 relative">
                        <!-- Botões de login (visíveis quando não autenticado) -->
                        <div class="login-buttons flex items-center">
                            <a href="/login" class="border-transparent text-gray-500 hover:border-indigo-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                                Login
                            </a>
                        </div>
                        <!-- Menu do usuário (visível quando autenticado) -->
                        <div class="user-menu hidden">
                            <div class="relative">
                                <button class="max-w-xs bg-white flex items-center text-sm rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" id="user-menu" aria-expanded="false" aria-haspopup="true">
                                    <span class="sr-only">Abrir menu do usuário</span>
                                    <span class="text-gray-700 pr-2 username-display">Username</span>
                                    <svg class="h-8 w-8 rounded-full text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                    </svg>
                                </button>
                                <div class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="user-menu">
                                    <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Perfil</a>
                                    <a href="#" id="logout-button" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Sair</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="-mr-2 flex items-center sm:hidden">
                    <button type="button" class="bg-white inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500" aria-expanded="false" id="mobile-menu-button">
                        <span class="sr-only">Abrir menu principal</span>
                        <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Menu móvel, exibido quando o botão de menu é clicado -->
        <div class="hidden sm:hidden mobile-menu" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1">
                <a href="/" class="bg-indigo-50 border-indigo-500 text-indigo-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    Dashboard
                </a>
                <a href="/clients" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    Clientes
                </a>
                <a href="/tasks" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    Tarefas
                </a>
                <a href="/calendar" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    <div class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                        </svg>
                        Calendário
                    </div>
                </a>
                <div x-data="{ open: false }" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    <button type="button" class="flex items-center w-full text-left" id="mobile-task-views-button">
                        <span>Visualizações</span>
                        <svg class="ml-2 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 011.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div class="hidden mt-2 pl-4 border-l border-gray-200" id="mobile-task-views">
                        <a href="/tasks/kanban" class="block py-2 text-gray-500 hover:text-gray-700">
                            Kanban
                        </a>
                        <a href="/tasks/priority-matrix" class="block py-2 text-gray-500 hover:text-gray-700">
                            PriorityMatrix™
                        </a>
                    </div>
                </div>
            </div>
            <div class="pt-4 pb-3 border-t border-gray-200">
                <div class="flex items-center px-4 mobile-user-menu hidden">
                    <div class="flex-shrink-0">
                        <svg class="h-10 w-10 rounded-full text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <div class="text-base font-medium text-gray-800 mobile-username-display">Username</div>
                    </div>
                </div>
                <div class="mt-3 space-y-1 mobile-user-menu hidden">
                    <a href="/profile" class="block px-4 py-2 text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100">
                        Perfil
                    </a>
                    <a href="#" id="mobile-logout-button" class="block px-4 py-2 text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100">
                        Sair
                    </a>
                </div>
                <div class="mt-3 space-y-1 mobile-login-buttons">
                    <a href="/login" class="block px-4 py-2 text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100">
                        Login
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="py-10">
        <main>
            <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <script>
        // Toggle for the task views dropdown
        document.getElementById('task-views-menu')?.addEventListener('click', function(e) {
            e.stopPropagation();
            const dropdown = this.nextElementSibling;
            dropdown.classList.toggle('hidden');
        });
        
        // Close dropdowns when clicking outside
        document.addEventListener('click', function(event) {
            // Fecha todos os dropdowns quando clicar fora
            const dropdowns = document.querySelectorAll('.origin-top-right:not(.hidden)');
            dropdowns.forEach(dropdown => {
                if (!event.target.closest('.relative')) {
                    dropdown.classList.add('hidden');
                }
            });
        });

        // Toggle do menu do usuário
        document.getElementById('user-menu')?.addEventListener('click', function(e) {
            e.stopPropagation();
            const dropdown = this.closest('.relative').querySelector('[role="menu"]');
            dropdown.classList.toggle('hidden');
        });

        // Função para atualizar a UI com base no estado de autenticação
        function updateAuthUI() {
            const loginButtons = document.querySelector('.login-buttons');
            const userMenu = document.querySelector('.user-menu');
            const mainMenu = document.querySelector('.sm\\:flex.sm\\:space-x-8');
            const token = localStorage.getItem('access_token');
            const userData = localStorage.getItem('user');
            
            if (token && userData) {
                // Usuário está autenticado
                if (loginButtons) loginButtons.classList.add('hidden');
                if (userMenu) {
                    userMenu.classList.remove('hidden');
                    // Atualiza o nome do usuário
                    try {
                        const user = JSON.parse(userData);
                        const usernameDisplay = userMenu.querySelector('.username-display');
                        if (usernameDisplay) {
                            usernameDisplay.textContent = user.username;
                        }
                    } catch (e) {
                        console.error('Erro ao parsear dados do usuário:', e);
                    }
                }
                if (mainMenu) mainMenu.classList.remove('hidden');
            } else {
                // Usuário não está autenticado
                if (loginButtons) loginButtons.classList.remove('hidden');
                if (userMenu) userMenu.classList.add('hidden');
                if (mainMenu) mainMenu.classList.add('hidden');
            }
        }

        // Atualiza a UI quando a página carrega
        document.addEventListener('DOMContentLoaded', function() {
            updateAuthUI();
            // Força uma atualização após um breve delay para garantir
            setTimeout(updateAuthUI, 100);
        });

        // Atualiza a UI quando o localStorage muda
        window.addEventListener('storage', function(e) {
            if (e.key === 'access_token' || e.key === 'user') {
                updateAuthUI();
            }
        });

        // Configura o botão de logout
        document.getElementById('logout-button')?.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });

        // Dispara um evento de storage manualmente para atualizar todos os componentes
        window.dispatchEvent(new StorageEvent('storage', {
            key: 'access_token',
            newValue: localStorage.getItem('access_token')
        }));

        // Toggle do menu móvel
        document.getElementById('mobile-menu-button')?.addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
            
            // Toggle do ícone do botão
            const openIcon = this.querySelector('.block');
            const closeIcon = this.querySelector('.hidden');
            openIcon.classList.toggle('hidden');
            openIcon.classList.toggle('block');
            closeIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('block');
        });

        // Toggle do menu de visualizações móvel
        document.getElementById('mobile-task-views-button')?.addEventListener('click', function() {
            const mobileTaskViews = document.getElementById('mobile-task-views');
            mobileTaskViews.classList.toggle('hidden');
        });

        // Configura o botão de logout móvel
        document.getElementById('mobile-logout-button')?.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });

        // Atualiza o menu móvel baseado no estado de autenticação
        function updateMobileAuthUI() {
            const mobileLoginButtons = document.querySelector('.mobile-login-buttons');
            const mobileUserMenu = document.querySelector('.mobile-user-menu');
            const token = localStorage.getItem('access_token');
            const userData = localStorage.getItem('user');
            
            if (token && userData) {
                // Usuário está autenticado
                if (mobileLoginButtons) mobileLoginButtons.classList.add('hidden');
                if (mobileUserMenu) {
                    mobileUserMenu.classList.remove('hidden');
                    // Atualiza o nome do usuário
                    try {
                        const user = JSON.parse(userData);
                        const usernameDisplay = document.querySelector('.mobile-username-display');
                        if (usernameDisplay) {
                            usernameDisplay.textContent = user.username;
                        }
                    } catch (e) {
                        console.error('Erro ao parsear dados do usuário para o menu móvel:', e);
                    }
                }
            } else {
                // Usuário não está autenticado
                if (mobileLoginButtons) mobileLoginButtons.classList.remove('hidden');
                if (mobileUserMenu) mobileUserMenu.classList.add('hidden');
            }
        }

        // Atualiza a UI móvel quando a página carrega
        document.addEventListener('DOMContentLoaded', function() {
            updateMobileAuthUI();
            // Força uma atualização após um breve delay
            setTimeout(updateMobileAuthUI, 100);
        });

        // Atualiza a UI móvel quando o localStorage muda
        window.addEventListener('storage', function(e) {
            if (e.key === 'access_token' || e.key === 'user') {
                updateMobileAuthUI();
            }
        });
    </script>
    
    <!-- Alpine.js para funcionalidades de dropdown e interatividade -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2/dist/alpine.min.js" defer></script>
</body>
</html>
